
name: Build Ender Pearl Catch JAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Fabric JAR
        run: gradle clean build --no-daemon

      - name: Verify and Prepare JAR
        shell: bash
        run: |
          mkdir -p release
          FOUND=0

          while IFS= read -r -d '' file; do
            case "$file" in
              *-sources.jar|*-dev.jar|*-javadoc.jar)
                continue
                ;;
            esac

            if ! unzip -Z1 "$file" | grep -Fxq \
              'fabric.mod.json'; then
              continue
            fi

            if ! unzip -Z1 "$file" | grep -Eq \
              '\.class$'; then
              continue
            fi

            cp "$file" release/EnderPearlCatch.jar
            FOUND=1
            break
          done < <(find build/libs -maxdepth 1 \
            -type f -name '*.jar' -print0)

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: No valid Fabric JAR found"
            exit 1
          fi

          echo "JAR successfully built"

      - name: Upload Final JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnderPearlCatch-JAR
          path: release/EnderPearlCatch.jar
          if-no-files-found: error
          retention-days: 30


name: Build Ender Pearl Catch

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod
        run: gradle build --no-daemon --stacktrace

      - name: Diagnose JAR Files
        shell: bash
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 4 -type f \
            -not -path './.git/*' | sort

          echo "=== JAR files ==="
          find . -type f -name '*.jar' \
            -not -path './.gradle/*' \
            -not -path './.git/*' \
            -print

          echo "=== Checking Fabric metadata ==="
          find . -type f -name '*.jar' \
            -not -path './.gradle/*' \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file; do
              echo "Checking: $file"
              if unzip -l "$file" | grep -q 'fabric.mod.json'; then
                echo "FOUND FABRIC MOD: $file"
                unzip -p "$file" fabric.mod.json
              else
                echo "No fabric.mod.json in this JAR"
              fi
            done

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: EnderPearlCatch-Debug
          path: |
            **/build/libs/*.jar
          if-no-files-found: warn
